# Railway deployment configuration for MSWYSL Medusa backend
# https://docs.railway.app/reference/config-as-code

[build]
builder = "nixpacks"
# Build only the medusa package and its workspace dependencies
buildCommand = "yarn install --frozen-lockfile && yarn workspace @medusajs/medusa build"

[deploy]
# `medusa start` runs migrations then starts the server
startCommand = "npx medusa start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "medusa-api"

# ── Required environment variables (set in Railway dashboard) ──────────────────
#
#   DATABASE_URL          postgresql://user:pass@host:5432/mswysl   (Railway Postgres)
#   REDIS_URL             redis://default:pass@host:6379             (Railway Redis)
#   JWT_SECRET            <random 32-char string>
#   COOKIE_SECRET         <random 32-char string>
#   STORE_CORS            https://mswysl.org,https://www.mswysl.org
#   ADMIN_CORS            https://admin.mswysl.org
#   AUTH_CORS             https://mswysl.org,https://admin.mswysl.org
#   MEDUSA_BACKEND_URL    https://<your-railway-service>.up.railway.app
#
#   STRIPE_API_KEY        sk_live_... (or sk_test_... for staging)
#   STRIPE_WEBHOOK_SECRET whsec_...
#
#   S3_FILE_URL           https://mswysl-media.s3.amazonaws.com
#   S3_ACCESS_KEY_ID      AKIA...
#   S3_SECRET_ACCESS_KEY  ...
#   S3_REGION             us-east-1
#   S3_BUCKET             mswysl-media
#
#   RESEND_API_KEY        re_...
#   EMAIL_FROM            orders@mswysl.org
#
#   NODE_ENV              production
